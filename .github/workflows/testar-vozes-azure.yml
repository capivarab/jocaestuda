name: Joca Estuda - testar vozes neurais

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuracao
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; then
            echo "::error::Configure os secrets AZURE_SPEECH_KEY e AZURE_SPEECH_REGION antes de executar."
            exit 1
          fi
      - name: Gerar duas amostras oficiais em portugues brasileiro
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python piloto/gerar_amostras_azure.py
          for f in piloto/vozes/amostra_*.mp3; do
            test -s "$f"
          done
      - name: Publicar amostras no ambiente de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piloto/vozes/amostra_joruto.mp3 piloto/vozes/amostra_sensei.mp3
          if ! git diff --cached --quiet; then
            git commit -m "build(audio): publicar amostras de vozes neurais"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
