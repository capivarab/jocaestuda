name: Joca Estuda - gerar video piloto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'piloto/gerar_video_auto.py'
      - '.github/workflows/piloto-video.yml'

permissions:
  contents: write

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar sintetizador e renderizador
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow==11.3.0 pydub==0.25.1
      - name: Renderizar video e legendas
        run: |
          python piloto/gerar_video_auto.py --output piloto/video/missao2_chance_ninja.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type,profile,pix_fmt,sample_rate -of compact piloto/video/missao2_chance_ninja.mp4
          ffmpeg -v error -i piloto/video/missao2_chance_ninja.mp4 -f null -
      - name: Publicar MP4 no endereco de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piloto/video/missao2_chance_ninja.mp4 piloto/video/missao2_chance_ninja.vtt
          if ! git diff --cached --quiet; then
            git commit -m "build(piloto): atualizar video e legendas"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
