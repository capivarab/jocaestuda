name: Joca Estuda - teste video de 12 segundos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piloto-teste-12s.yml'

permissions:
  contents: write

jobs:
  video-controle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Criar clip pequeno com movimento real e sinal sonoro
        run: |
          mkdir -p piloto/video
          ffmpeg -hide_banner -v error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=24:duration=12' \
            -f lavfi -i 'sine=frequency=523:sample_rate=44100:duration=12' \
            -map 0:v:0 -map 1:a:0 \
            -vf 'format=yuv420p' -af 'volume=0.04' \
            -c:v libx264 -profile:v baseline -level 3.0 \
            -preset veryfast -crf 28 -g 48 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -ar 44100 -ac 2 \
            -movflags +faststart -t 12 \
            piloto/video/teste_controle_12s.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,profile,width,height,pix_fmt -of compact piloto/video/teste_controle_12s.mp4
          ffmpeg -hide_banner -v error -i piloto/video/teste_controle_12s.mp4 -f null -
      - name: Publicar clip sem alterar o index principal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add piloto/video/teste_controle_12s.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'test(piloto): publicar video de controle 12s'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
